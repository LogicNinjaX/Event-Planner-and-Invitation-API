<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Cancelled</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fef7f0 0%, #f8fafc 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .gentle-pulse {
            animation: gentlePulse 3s ease-in-out infinite;
        }

        @keyframes gentlePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .fade-in {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main style="max-width: 672px; margin: 0 auto; padding: 32px 16px; position: relative; z-index: 10;">
        <div style="background: white; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); padding: 32px; text-align: center;"
            class="fade-in">
            <!-- Cancel Icon -->
            <div style="margin-bottom: 24px;">
                <div style="width: 96px; height: 96px; background: #fef2f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;"
                    class="gentle-pulse">
                    <svg style="width: 48px; height: 48px; color: #ef4444;" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </div>
            </div>

            <!-- Main Message -->
            <h1 style="font-size: 36px; font-weight: bold; color: #1f2937; margin-bottom: 16px;">RSVP Cancelled</h1>
            <p style="font-size: 20px; color: #6b7280; margin-bottom: 48px;">We understand plans change. Thanks for
                letting us know!</p>

            <!-- Action Button -->
            <div style="margin-bottom: 32px;">
                <button onclick="window.location.href='accept-rsvp-api'"
                    style="background: #0ea5e9; color: white; font-weight: 600; padding: 16px 32px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s; width: 100%; font-size: 16px;"
                    onmouseover="this.style.background='#0284c7'" onmouseout="this.style.background='#0ea5e9'">
                    ↩️ Re-confirm Attendance
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div style="text-align: center; margin-top: 32px;">
            <p style="color: #6b7280; font-size: 14px; margin: 0;">
                Questions or need assistance?
                <a href="mailto:events@company.com"
                    style="color: #2563eb; text-decoration: underline; transition: color 0.2s;"
                    onmouseover="this.style.color='#1e40af'" onmouseout="this.style.color='#2563eb'">Contact Us</a>
            </p>
        </div>
    </main>
</body>

</html>
